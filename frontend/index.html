<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#052e44" />
    <title>Progresso</title>
    <!--
      No-flash theme: set data-theme before first paint from saved pref or OS setting.
      Must be inline (not a bundled module) so it runs before React mounts.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var lang = localStorage.getItem('i18nextLng')
          if (lang === 'en' || lang === 'sk') document.documentElement.setAttribute('lang', lang)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
